  writer_note: '지방세특례제한법 제67조에 따라 경형자동차(배기량 등 법정 기준 충족 차량)에 대해
    취득세를 감면하되, 감면 대상 금액은 산출된 취득세액(차량가격이 아닌 세액) 기준 75만원 이하이며,
    75만원을 초과하는 경우 초과분에 대해서만 과세한다(STEP 28-189 lbox.kr 확인). 지방세특례제한법
    제177조의2(감면 최소납부제, 85% 한도)와의 관계는 이번 1차 구현에 반영하지 않았다(STEP 28-190/191
    범위 확정). ⚠️ law.go.kr 원문 전체 조문 대조는 미완료.'
  reviewer_expectation:
  - 경형자동차 감면 한도가 "차량가격"이 아닌 "산출 세액" 기준 75만원임을 명시
  - 75만원 초과분만 과세됨을 명시
  forbidden_articles: []
