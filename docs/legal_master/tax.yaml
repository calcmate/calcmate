# legal_master/tax.yaml — 법령 조항 엔티티(SSOT). scripts/migrate_legal_master.py 생성.
income_tax_act_137:
  law: 소득세법
  article: 제137조
  related_articles:
  - 제134조
  - 제140조
  authority: 국세청
  confidence: medium
  last_verified: 2026-07-05
  verification_source:
  - law.go.kr
  - nts.go.kr
  writer_note: '소득세법 제137조(근로소득세액의 연말정산)에 따라 원천징수의무자는 다음 연도 2월분 근로소득(또는 퇴직자의 퇴직월 근로소득)
    지급 시 1년간의 근로소득에 소득·세액공제를 반영해 최종 소득세를 정산한다. 매월 원천징수(제134조)는 잠정 세액이며, 연말정산으로 과부족을
    정산한다. ⚠️ 본 계산 결과는 참고용 예상치이며, 실제 연말정산 결과는 국세청 홈택스 및 회사 정산 결과와 다를 수 있다는 문구를 반드시
    포함한다. "간이 추정"이라는 표현만으로 대체하지 않는다.

    '
  reviewer_expectation:
  - 법령명(소득세법) 및 조항(제137조) 언급
  - 참고용 예상치이며 홈택스/회사 정산결과와 다를 수 있음(면책 문구) 포함
  forbidden_articles:
  - 소득세법 제55조
  - 소득세법 제63조
  forbidden_phrases: []
  needs_human_legal: true
  # 국세청 공식자료 + 소득세법 원문(law.go.kr) 교차검증(2025 귀속/2026 연말정산). 정식 데이터.
  deduction_rules:
    인적공제:
      basic: '기본공제 1인당 150만원(본인·배우자·부양가족, 소득·나이 요건)'
      additional: '경로우대(70세↑) 100만원 / 장애인 200만원 / 부녀자 50만원 / 한부모 100만원'
    신용카드등소득공제:
      rate: '신용 15% / 체크·현금영수증 30% / 전통시장·대중교통 40%'
      threshold: '총급여 25% 초과분'
      limit: '총급여 7천만원↓ 300만원(자녀시 400만) / 7천만원↑ 250만원(자녀시 300만)'
    의료비세액공제:
      rate: '일반 15% / 난임시술비 30% / 미숙아·선천성이상아 20%'
      threshold: '총급여 3% 초과분'
      limit: '일반 부양가족 700만원 / 본인·65세이상·장애인·산정특례·미숙아·난임은 한도없음'
    교육비세액공제:
      rate: '15%'
      limit: '취학전·초중고 1인 300만원 / 대학생 1인 900만원 / 본인 전액'
    연금계좌세액공제:
      rate: '12%(총급여 5,500만원↓ 또는 종합소득 4,500만원↓는 15%)'
      limit: '연금저축 600만원, 퇴직연금 합산 900만원'
      source: '소득세법 제59조의3'
  calculation_flow:
  - '총급여액 = 연간 근로소득 - 비과세소득'
  - '근로소득금액 = 총급여액 - 근로소득공제'
  - '차감소득금액 = 근로소득금액 - (인적공제 + 연금보험료공제 + 특별소득공제)'
  - '과세표준 = 차감소득금액 - 그 밖의 소득공제'
  - '산출세액 = 과세표준 × 세율(6~45%) - 누진공제'
  - '결정세액 = 산출세액 - 세액감면 - 세액공제'
  - '차감납부/환급 = 결정세액 - 기납부세액(원천징수)'

income_tax_act_127:
  law: 소득세법
  article: 제127조
  related_articles:
  - 제164조의3
  - 소득세법 시행령 제184조의2
  authority: 국세청
  confidence: high
  last_verified: 2026-08-08
  verification_source:
  - law.go.kr
  - nts.go.kr
  writer_note: |
    소득세법 제127조(원천징수의무)에 따라 원천징수의무자(사업자·기관)는
    인적용역 소득 지급 시 소득세 3%를 원천징수해야 한다. 지방소득세(소득세의 10%) 0.3%를
    포함하여 실무에서는 3.3%라고 표현한다.

    ⚠️ 반드시 포함할 문구:
    - 원천징수는 납세 완료가 아니며, 이 금액은 원천징수액이며 최종 세액이 아님
    - 매년 5월 종합소득세 신고를 통해 정산됨
    - "이 계산기는 인적용역 소득(사업소득)에만 적용되며, 근로소득·기타소득은 해당하지 않습니다"
    - "계산 결과는 참고용이며 실제 납부세액은 신고 내용에 따라 달라질 수 있습니다"

    ⚠️ 절대 쓰지 말 것:
    - "세금을 다 낸 것" 또는 "원천징수하면 종합소득세 신고 불필요"
    - 근로소득에도 적용된다는 서술
    - 특정 업종·금액별 예외(예: 125만원 면제 등)를 추측으로 단정하는 서술
  reviewer_expectation:
  - 소득세법 제127조 조항 언급
  - 3.3% = 소득세 3% + 지방소득세 0.3% 명시
  - 종합소득세 신고 의무 언급
  - 원천징수액은 최종 세액이 아님(선납 개념) 명시
  - 참고용 예상치 면책 문구 포함
  forbidden_articles: []
  forbidden_phrases:
  - 원천징수로 납세 완료
  - 종합소득세 신고 불필요
  needs_human_legal: false
  calculation_flow:
  - '원천징수세액 = 총 수입 × 3% (소득세, 소득세법 제127조)'
  - '지방소득세 = 소득세 × 10% = 총 수입 × 0.3%'
  - '합산 원천징수세액 = 총 수입 × 3.3%'
  - '실수령액 = 총 수입 - 원천징수세액 = 총 수입 × 96.7%'
  - '※ 원천징수액은 선납 세액이며, 5월 종합소득세 신고 시 정산(환급 또는 추가납부)'

# ── 지방세(자동차 취득세) 관련 entity — STEP 28-195/196에서 추가.
# law.go.kr 원문은 JS 렌더링으로 직접 조회하지 못해 easylaw.go.kr/정부24/KB금융/lbox.kr 등
# 2차 출처로 교차확인(STEP 28-188/189/190). confidence: medium — 원문 조문 전체 대조 미완료,
# 미확정 부분은 각 writer_note에 ⚠️로 명시.
local_tax_act_12:
  law: 지방세법
  article: 제12조
  related_articles:
  - 지방세법 시행령 제23조
  authority: 행정안전부
  confidence: medium
  last_verified: 2026-08-29
  verification_source:
  - easylaw.go.kr
  - 정부24(gov.kr)
  - KB금융
  needs_human_legal: true
  writer_note: '지방세법 제12조에 따라 자동차 취득 시 표준세율이 차종별로 다르게 적용된다(비영업용
    승용차 7%, 경차·영업용 4%, 승합·화물·특수차 5%, 이륜차 2%). 2011년 지방세법 개정(법률 제10221호,
    2011-1-1 시행)으로 종전의 취득세와 등록세가 "취득세"로 통합되었으며, 현재는 별도의 "등록세"라는
    세목이 존재하지 않는다(STEP 28-188 확정). ⚠️ law.go.kr 원문 전체 조문(항·호 세부 구성)은 직접
    대조하지 못했다 — easylaw.go.kr/정부24/KB금융 등 2차 출처로 세율만 교차확인한 상태이며, 조문의
    정확한 항·호 번호 및 예외 규정은 미확정이다.'
  reviewer_expectation:
  - 지방세법(제12조) 언급
  - 2011년 취득세·등록세 통합 사실 언급(등록세라는 별도 세목이 현재 존재하지 않음)
  - 차종별 세율이 다름을 명시
  forbidden_articles:
  - 지방세법 제6조
  # IRP-29: 기존 "등록세"(단어 1개)는 계산기 자신의 정상 서비스명("취등록세")과
  # reviewer_expectation이 요구하는 올바른 부정 설명("등록세라는 별도 세목이 존재하지
  # 않는다")까지 부분 문자열로 걸러내는 과잉 차단이었다(IRP-28 진단). 실제로 막아야 하는
  # 것은 "지금도 등록세를 별도로 낸다"는 폐기된 법령 인식에 기반한 잘못된 주장이므로,
  # 다른 legal_master 엔티티(employment/labor/realty)와 동일한 문장형 관례로 교체한다.
  forbidden_phrases:
  - 등록세를 별도로 납부
  - 등록세가 별도로 부과
  calculation_flow:
  - '표준세율 = RATE_MAP[car_type] (비영업승용 7% / 경차·영업용 4% / 승합·화물·특수 5% / 이륜차 2%)'
  - '표준취득세액 = 차량가격 × 표준세율'

