  last_verified: 2026-07-05
  verification_source: [law.go.kr, nts.go.kr]
  writer_note: >
    소득세법 제137조(근로소득세액의 연말정산)에 따라 원천징수의무자는 다음
    연도 2월분 근로소득(또는 퇴직자의 퇴직월 근로소득) 지급 시 1년간의
    근로소득에 소득·세액공제를 반영해 최종 소득세를 정산한다. 매월
    원천징수(제134조)는 잠정 세액이며, 연말정산으로 과부족을 정산한다.
    ⚠️ 본 계산 결과는 참고용 예상치이며, 실제 연말정산 결과는 국세청
    홈택스 및 회사 정산 결과와 다를 수 있다는 문구를 반드시 포함한다.
    "간이 추정"이라는 표현만으로 대체하지 않는다.

    [출력 형식 필수]
    1. 본문에 "소득세법 제137조" 문자열을 정확하게 최소 1회 포함한다.
    2. 프롬프트의 [계산 근거 데이터]에 제공된 공제 규칙(의료비/신용카드/연금저축/교육비/인적공제)을
    활용해, 서로 다른 공제 항목이 적용된 '질적으로 다른' 계산 예시를 정확히 2개 작성한다.
    (예: ① 부양가족+의료비 지출 케이스, ② 1인가구+연금저축 납입 케이스)
    3. 각 예시는 "예를 들어, ... = OOO원" 형식으로 구체 계산식과 결과 금액을 명시한다.
    4. "소득세법 제55조", "소득세법 제63조"는 본문에 언급하지 않는다.
  reviewer_expectation:
