severance-pay:
  name: 퇴직금 계산기
  law: 근로자퇴직급여 보장법
  article: 제8조
  related_articles: []
  authority: 고용노동부
  confidence: high
  last_verified: 2026-07-05
  verification_source: [law.go.kr, easylaw.go.kr]
  writer_note: >
    근로자퇴직급여 보장법 제8조에 따라 사용자는 계속근로기간 1년에 대해 30일분
    이상의 평균임금을 퇴직금으로 지급해야 한다. 2005년 이 법 제정 이후
    근로기준법 제34조는 이관·삭제되었으므로 절대 인용하지 않는다.

    [자발적 퇴사 — 반드시 정확히 서술]
    퇴직금은 자발적 퇴사(의원면직) 포함 모든 퇴직 사유에서 계속근로기간 1년 이상이면
    지급된다(근로자퇴직급여 보장법 제8조). "자발적 퇴사이면 퇴직금을 받기 어렵다",
    "자발적으로 퇴사하는 경우 퇴직금 수령이 어렵다" 등의 표현은 법적으로 틀린
    서술이므로 절대 작성하지 않는다.

    [평균임금 산정 — 반드시 정확히 서술]
    평균임금 = 퇴직 사유 발생일 이전 3개월 동안 지급된 임금 총액 ÷ 3개월 총일수
    (근로기준법 제2조제1항제6호).
    포함 항목: 기본급, 연장·야간·휴일근로 가산수당, 통상 지급 상여금(연간총액의 1/12).
    제외 항목: 임시로 지급된 수당, 1회성 급부 (근로기준법 시행령 제2조).
    "초과근무수당이나 상여금은 포함하지 않는다"는 서술은 사실과 정반대이므로 절대 쓰지 않는다.

    [출력 형식 필수]
    1. 본문에 "근로자퇴직급여 보장법 제8조" 문자열을 정확하게 최소 1회 포함한다.
    2. 퇴직금의 법적 근거는 오직 이 조항이다. "근로기준법 제34조"는 폐지되어
    존재하지 않으므로 본문에 절대 언급하지 않는다. 조항을 쓸 때 법령명이
    "근로기준법"이 아니라 "근로자퇴직급여 보장법"임을 반드시 확인한다.
  reviewer_expectation:
    - 법령명(근로자퇴직급여 보장법) 및 조항(제8조) 언급
    - 근로기준법 제34조 언급 없음
    - 초과근무수당·상여금 포함 여부 서술이 있으면 "포함"으로 명시
    - 자발적 퇴사 시에도 퇴직금 지급됨을 단정적으로 표현(수령 어렵다는 표현 금지)
  forbidden_articles: [근로기준법 제34조]
  forbidden_phrases:
    - 자발적 퇴사의 경우 퇴직금 수령이 어려울
    - 자발적으로 퇴사하는 경우 퇴직금 수령이 어려울
    - 자발적 퇴사이면 퇴직금을 받기 어렵
    - 자진퇴사의 경우 퇴직금을 받기 어렵
    # 추가: "받을 수 없다" 계열 자발적 퇴사 오류 패턴 (Phase 5-4-A-FIX)
    - 자발적으로 퇴사한 경우나 근무 기간이 1년 미만인 경우에는 퇴직금을 받을 수 없
    - 자발적 퇴사 또는 퇴사 후 1년이 경과된 경우에는 퇴직금을 지급받지 못
    - 자발적 퇴사나 비위행위로 인해 해고될 경우에도 받을 수 없는 상황
