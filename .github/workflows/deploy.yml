name: Deploy CalcMate to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'data/workspace/_site/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 배포 동결(DEPLOY-FREEZE B3): 계산기 산출물이 동결 기준선과 하나라도 다르면 업로드 전에 실패한다.
      # 공용 사이트 파일(index/sitemap/공통 페이지)은 비교 대상이 아니다.
      - name: Calculator deploy freeze guard
        run: python3 scripts/deploy_freeze_guard.py check --baseline .github/deploy_freeze_baseline.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'data/workspace/_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
