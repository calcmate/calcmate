name: Backend CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - "modules/**"
      - "content/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  core-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run core regression suite
        run: |
          python -m pytest \
            tests/test_step28_20_ssot_wiring.py \
            tests/test_step28_24_content_ssot_prompt_wiring.py \
            tests/test_step28_26_db_save_gate.py \
            tests/test_scheduler_line_isolation.py \
            tests/test_blog_scheduler.py \
            tests/test_blog_schedule_slots.py \
            tests/test_step28_52_content_tracking.py
