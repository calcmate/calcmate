name: CalcMate CI
'on':
  pull_request:
    branches:
    - master
  push:
    branches:
    - master
    paths:
    - modules/**
    - content/**
    - tests/**
    - templates/library/**
    - requirements.txt
    - .github/workflows/ci.yml
    - loan_ground_truth_parity.py
    - pytest.ini
    - conftest.py
  workflow_dispatch: {}
  schedule:
  - cron: 0 2 * * 1
permissions:
  contents: read
env:
  PYTHON_VERSION: '3.12'
  PIP_CACHE_DIR: ~/.cache/pip
jobs:
  fast-unit:
    name: Fast Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        pip install pytest pytest-xdist'
    - name: Run Fast Unit Tests
      run: "python -m pytest \\\n  modules/factory/tests/test_factory_mvp.py \\\n  -q --tb=short -x \\\n  -k \"not integration and not full_factory and not GroundTruth and not Parity and not QualityGates and not gate and not quality\" \\\n  --maxfail=5"
  ground-truth-parity:
    name: Ground Truth & Parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        pip install pytest pytest-xdist formualizer mortgagemath'
    - name: Run Ground Truth & Parity Tests
      run: "# Factory Ground Truth + Parity\npython -m pytest \\\n  modules/factory/tests/test_factory_mvp.py \\\n  -q --tb=short \\\n  -k \"GroundTruth or Parity\" \\\n  --maxfail=3\n\n# Loan Ground Truth + mortgagemath Parity\npython loan_ground_truth_parity.py"
    - name: Upload Parity Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: parity-report
        path: 'parity-report.json

          ground-truth-summary.json'
        retention-days: 7
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        pip install pytest pytest-xdist formualizer mortgagemath'
    - name: Run Quality Gates & Generate Summary
      run: python generate_quality_gate_summary.py
    - name: Upload Quality Gate Summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-gate-summary
        path: quality-gate-summary.json
        retention-days: 7
  full-regression:
    name: Full Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        pip install pytest pytest-xdist formualizer mortgagemath'
    - name: Run Factory MVP Tests (JUnit XML)
      run: "python -m pytest \\\n  modules/factory/tests/test_factory_mvp.py \\\n  -q --tb=short \\\n  --maxfail=10 \\\n  --junitxml=test-results-factory.xml"
    - name: Run Loan Calculator Tests (JUnit XML)
      run: "python -m pytest \\\n  tests/test_loan_calculator.py \\\n  -q --tb=short \\\n  --maxfail=5 \\\n  --junitxml=test-results-loan.xml"
    - name: Run Existing Core Regression Tests (JUnit XML)
      run: "python -m pytest \\\n  tests/test_step28_20_ssot_wiring.py \\\n  tests/test_step28_24_content_ssot_prompt_wiring.py \\\n  tests/test_step28_26_db_save_gate.py \\\n  tests/test_scheduler_line_isolation.py \\\n  tests/test_blog_scheduler.py \\\n  tests/test_blog_schedule_slots.py \\\n  tests/test_step28_52_content_tracking.py \\\n  -q --tb=short \\\n  --maxfail=10 \\\n  --junitxml=test-results-existing.xml"
    - name: Merge JUnit XML Reports
      run: "python -c \"import xml.etree.ElementTree as ET; import os; testsuite_root = ET.Element('testsuites'); total_tests = 0; total_failures = 0; total_errors = 0; total_skipped = 0; total_time = 0.0; \nfor xml_file in [\"test-results-factory.xml\", \"test-results-loan.xml\", \"test-results-existing.xml\"]:\n  if os.path.exists(xml_file):\n    tree = ET.parse(xml_file); root = tree.getroot()\n    if root.tag == \"testsuite\": suites = [root]\n    else: suites = list(root)\n    for suite in suites:\n      total_tests += int(suite.get(\"tests\", 0))\n      total_failures += int(suite.get(\"failures\", 0))\n      total_errors += int(suite.get(\"errors\", 0))\n      total_skipped += int(suite.get(\"skipped\", 0))\n      total_time += float(suite.get(\"time\", 0))\n      testsuite_root.append(suite)\nmerged_root = ET.Element(\"testsuites\")\nmerged_root.set(\"tests\", str(total_tests))\nmerged_root.set(\"failures\", str(total_failures))\nmerged_root.set(\"errors\", str(total_errors))\nmerged_root.set(\"\
        skipped\", str(total_skipped))\nmerged_root.set(\"time\", str(total_time))\nfor child in testsuite_root:\n  merged_root.append(child)\nET.ElementTree(merged_root).write(\"test-results.xml\", encoding=\"utf-8\", xml_declaration=True)\nprint(f\"Merged: tests={total_tests}, failures={total_failures}, errors={total_errors}, skipped={total_skipped}\")\""
    - name: Upload Regression Summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: regression-summary
        path: test-results.xml
        retention-days: 7
  dependency-update:
    name: Dependency Update Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        pip install pytest pytest-xdist'
    - name: Check for OSS updates
      id: check_updates
      run: 'echo "Checking formualizer..."

        CURRENT_FZ=$(python -c "import formualizer; print(formualizer.__version__ if hasattr(formualizer, ''__version__'') else ''0.10.1'')")

        echo "current_formualizer=$CURRENT_FZ" >> $GITHUB_OUTPUT


        echo "Checking mortgagemath..."

        CURRENT_MM=$(python -c "import mortgagemath; print(mortgagemath.__version__")

        echo "current_mortgagemath=$CURRENT_MM" >> $GITHUB_OUTPUT'
    - name: Validate OSS upgrades
      if: github.event_name == 'workflow_dispatch'
      run: "python -m pytest \\\n  modules/factory/tests/test_factory_mvp.py \\\n  -q --tb=short \\\n  --maxfail=5\n\npython loan_ground_truth_parity.py\n\n# Quality Gates\npython -m pytest \\\n  modules/factory/tests/test_factory_mvp.py \\\n  -q --tb=short \\\n  -k \"QualityGates or gate or quality\" \\\n  --maxfail=5"
    - name: Generate Dependency Validation Report
      run: python generate_dependency_validation.py
    - name: Upload Dependency Validation Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-validation
        path: dependency-validation.json
        retention-days: 30
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
    - fast-unit
    - ground-truth-parity
    - quality-gates
    if: always()
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Generate Summary
      run: 'echo "## CI Summary" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "| Layer | Job | Status |" >> $GITHUB_STEP_SUMMARY

        echo "|-------|-----|--------|" >> $GITHUB_STEP_SUMMARY


        # fast-unit

        result="${{ needs.fast-unit.result }}"

        if [ "$result" == "success" ]; then status="PASS"; elif [ "$result" == "failure" ]; then status="FAIL"; elif [ "$result" == "cancelled" ]; then status="CANCELLED"; else status="UNKNOWN"; fi

        echo "| fast-unit | fast-unit | $status |" >> $GITHUB_STEP_SUMMARY


        # ground-truth-parity

        result="${{ needs.ground-truth-parity.result }}"

        if [ "$result" == "success" ]; then status="PASS"; elif [ "$result" == "failure" ]; then status="FAIL"; elif [ "$result" == "cancelled" ]; then status="CANCELLED"; else status="UNKNOWN"; fi

        echo "| ground-truth-parity | ground-truth-parity | $status |" >> $GITHUB_STEP_SUMMARY


        # quality-gates

        result="${{ needs.quality-gates.result }}"

        if [ "$result" == "success" ]; then status="PASS"; elif [ "$result" == "failure" ]; then status="FAIL"; elif [ "$result" == "cancelled" ]; then status="CANCELLED"; else status="UNKNOWN"; fi

        echo "| quality-gates | quality-gates | $status |" >> $GITHUB_STEP_SUMMARY


        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### Artifacts" >> $GITHUB_STEP_SUMMARY

        ls -la artifacts/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No artifacts" >> $GITHUB_STEP_SUMMARY'
